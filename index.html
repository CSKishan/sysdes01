<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%A6%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Packet &amp; Post — Learn System Design</title>
    <script>
      // Apply the persisted theme before first paint, so a returning
      // light-mode user doesn't see a flash of the dark default while
      // React mounts and settingsStore rehydrates. Mirrors the zustand
      // persist storage shape ({"state": {"theme": ...}, ...}) without
      // depending on zustand itself -- this has to run before any
      // module script loads. Failure (private browsing, corrupted
      // JSON, etc.) just leaves the dark default in place.
      (function () {
        try {
          var raw = localStorage.getItem('packet-and-post.settings')
          var parsed = raw && JSON.parse(raw)
          if (parsed && parsed.state && parsed.state.theme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
